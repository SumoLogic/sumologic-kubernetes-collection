sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
metadata:
  logs:
    statefulset:
      extraPorts:
        - name: otlphttp2
          containerPort: 4319
          protocol: TCP
        - name: otlphttp3
          containerPort: 4320
          protocol: TCP
