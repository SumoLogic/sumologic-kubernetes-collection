sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  ipv6mode: true
  logs:
    collector:
      otelcol:
        enabled: true
    multiline:
      enabled: false
    systemd:
      enabled: true
    container:
      enabled: false
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
otellogs:
  logLevel: debug
  metricsLevel: detailed
