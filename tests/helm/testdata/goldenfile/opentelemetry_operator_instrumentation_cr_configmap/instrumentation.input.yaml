sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
opentelemetry-operator:
  enabled: true
instrumentation:
  createDefaultInstrumentation: true
  instrumentationNamespaces: "ot-operator1,ot-operator2"
  instrumentationJobImage:
    image:
      repository: asd
      tag: asd
