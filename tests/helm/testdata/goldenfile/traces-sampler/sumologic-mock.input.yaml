sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
debug:
  sumologicMock:
    enabled: true
  instrumentation:
    tracesSampler:
      print: true
      # enable metrics forwarding
      forwardToSumologicMock: true
