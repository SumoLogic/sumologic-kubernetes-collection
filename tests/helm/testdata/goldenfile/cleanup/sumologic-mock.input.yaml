debug:
  sumologicMock:
    enabled: true
  enableLocalMode: true
sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  cleanupEnabled: true
  setup:
    job:
      initContainerImage:
        repository: myrepo
        tag: mytag
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
