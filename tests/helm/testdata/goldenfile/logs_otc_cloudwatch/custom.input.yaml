sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  logs:
    collector:
      otelcloudwatch:
        enabled: true
        persistence:
          enabled: false
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
metadata:
  image:
    repository: my_repository
    tag: my_tag
