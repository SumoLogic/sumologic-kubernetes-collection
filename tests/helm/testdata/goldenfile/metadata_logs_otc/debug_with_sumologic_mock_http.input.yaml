debug:
  sumologicMock:
    enabled: true
  logs:
    metadata:
      print: true
      forwardToSumologicMock: true
      stopLogsIngestion: true
sumologic:
  sourcelessMode: false
  useExporterBatching: true
  logs:
    sourceType: http
  sourcelessModeAck: true
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
