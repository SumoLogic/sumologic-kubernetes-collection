sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
          enabled: false
debug:
  sumologicMock:
    enabled: true
  metrics:
    metadata:
      print: true
      forwardToSumologicMock: true
      stopLogsIngestion: true
