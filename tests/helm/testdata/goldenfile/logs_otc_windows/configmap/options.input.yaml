sumologic:
  sourcelessMode: true
  sourcelessModeAck: true
  useExporterBatching: true
  ipv6mode: true
  logs:
    collector:
      otellogswindows:
        enabled: true
    multiline:
      enabled: false
    systemd:
      enabled: true
    container:
      enabled: false
  metrics:
    collector:
      otelcol:
        singleLayerPipeline:
          migrationDocAcknowledged: true
otellogswindows:
  logLevel: debug
  daemonset:
    nameservers:
      - 10.100.0.10
