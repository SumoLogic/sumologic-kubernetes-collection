sumologic:
  events:
    enabled: false
  logs:
    enabled: false
  metrics:
    enabled: false

opentelemetry-operator:
  enabled: true

  manager:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi

instrumentation:
  createDefaultInstrumentation: true
  instrumentationNamespaces: "test-apps"
  python:
    metrics:
      enabled: true
    traces:
      enabled: true

otelcolInstrumentation:
  enabled: true

tracesGateway:
  enabled: false
