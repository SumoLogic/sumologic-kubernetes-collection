{{- if and (eq (include "metrics.otelcol.enabled" .) "true") .Values.sumologic.metrics.collector.otelcol.enabled }}
{{- if and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled (not .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.migrationDocAcknowledged) }}
{{- $migrationKeys := list -}}
{{- if .Values.metadata.metrics.statefulset.nodeSelector }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.nodeSelector -> sumologic.metrics.collector.otelcol.nodeSelector" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.tolerations }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.tolerations -> sumologic.metrics.collector.otelcol.tolerations" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.affinity }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.affinity -> sumologic.metrics.collector.otelcol.affinity" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.podLabels }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.podLabels -> sumologic.metrics.collector.otelcol.podLabels" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.podAnnotations }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.podAnnotations -> sumologic.metrics.collector.otelcol.podAnnotations" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.priorityClassName }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.priorityClassName -> sumologic.metrics.collector.otelcol.priorityClassName" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.containers.otelcol.securityContext }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.containers.otelcol.securityContext -> sumologic.metrics.collector.otelcol.securityContext" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.extraEnvVars }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.extraEnvVars -> sumologic.metrics.collector.otelcol.extraEnvVars" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.extraVolumes }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.extraVolumes -> sumologic.metrics.collector.otelcol.extraVolumes" -}}
{{- end -}}
{{- if .Values.metadata.metrics.statefulset.extraVolumeMounts }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.statefulset.extraVolumeMounts -> sumologic.metrics.collector.otelcol.extraVolumeMounts" -}}
{{- end -}}
{{- if .Values.metadata.metrics.autoscaling.enabled }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.autoscaling.* -> sumologic.metrics.collector.otelcol.autoscaling.*" -}}
{{- end -}}
{{- if .Values.metadata.metrics.config.override }}
{{- $migrationKeys = append $migrationKeys "  - metadata.metrics.config.override (INCOMPATIBLE: use metadata.metrics.config.merge instead, or disable single-layer mode)" -}}
{{- end -}}
{{- $msg := "singleLayerPipeline is enabled but migrationDocAcknowledged is not set to true.\nPlease read the migration guide at https://github.com/SumoLogic/sumologic-kubernetes-collection/blob/main/docs/single-layer-pipeline-migration.md and set\nsumologic.metrics.collector.otelcol.singleLayerPipeline.migrationDocAcknowledged=true to proceed." -}}
{{- if $migrationKeys }}
{{- $msg = printf "%s\n\nThe following metadata.metrics.* keys are set and must be migrated to their collector equivalents:\n%s" $msg (join "\n" $migrationKeys) -}}
{{- end -}}
{{- if .Values.sumologic.metrics.collector.otelcol.config.merge }}
{{- $msg = printf "%s\n\nWARNING: sumologic.metrics.collector.otelcol.config.merge is set. The collector pipeline is renamed from 'metrics' to 'metrics/collector' in single-layer mode. If your merge references service.pipelines.metrics, update it to service.pipelines.metrics/collector. See https://github.com/SumoLogic/sumologic-kubernetes-collection/blob/main/docs/single-layer-pipeline-migration.md#pipeline-rename-metricscollector." $msg -}}
{{- end }}
{{- fail $msg }}
{{- end }}
{{- if and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled .Values.metadata.metrics.config.override }}
{{- fail "metadata.metrics.config.override cannot be used with singleLayerPipeline.enabled. Use metadata.metrics.config.merge instead, or disable single-layer mode." }}
{{- end }}
{{- if and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled (or .Values.metadata.metrics.statefulset.extraEnvVars .Values.metadata.metrics.statefulset.extraVolumes .Values.metadata.metrics.statefulset.extraVolumeMounts) }}
{{- fail "metadata.metrics.statefulset.extraEnvVars/extraVolumes/extraVolumeMounts cannot be used with singleLayerPipeline.enabled. Use sumologic.metrics.collector.otelcol.extraEnvVars/extraVolumes/extraVolumeMounts instead." }}
{{- end }}
{{ $baseConfig := (tpl (.Files.Get "conf/metrics/collector/otelcol/config.yaml") .) | fromYaml }}
{{ $mergeConfig := .Values.sumologic.metrics.collector.otelcol.config.merge }}
{{ $overrideConfig := .Values.sumologic.metrics.collector.otelcol.config.override }}
{{ $finalConfig := "" }}
{{ if $overrideConfig }}
{{ $finalConfig = $overrideConfig }}
{{ else }}
{{ $finalConfig = mergeOverwrite $baseConfig $mergeConfig }}
{{- if .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled }}
{{/* In single-layer mode, also apply metadata layer config.merge so existing customers'
     metadata-layer customizations carry over to the combined collector pipeline. */}}
{{ $metadataMergeConfig := .Values.metadata.metrics.config.merge }}
{{ if $metadataMergeConfig }}
{{ $finalConfig = mergeOverwrite $finalConfig $metadataMergeConfig }}
{{ end }}
{{- end }}
{{ end }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ template "sumologic.metadata.name.metrics.collector.opentelemetrycollector" . }}
  namespace: {{ template "sumologic.namespace"  . }}
  labels:
    {{- include "sumologic.labels.metrics.opentelemetrycollector" . | nindent 4 }}
    {{- include "sumologic.labels.common" . | nindent 4 }}
    {{- include "sumologic.label.scrape" . | nindent 4 }}
    {{- if .Values.sumologic.podLabels }}
    {{ toYaml .Values.sumologic.podLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.sumologic.metrics.collector.otelcol.podLabels }}
    {{ toYaml .Values.sumologic.metrics.collector.otelcol.podLabels | nindent 4 }}
    {{- end }}
spec:
  image: {{ template "sumologic.metrics.collector.image" . }}
  mode: statefulset
{{- if not (eq (include "metrics.collector.autoscaling.enabled" .) "true") }}
  replicas: {{ .Values.sumologic.metrics.collector.otelcol.replicaCount }}
{{- end }}
  serviceAccount: {{ template "sumologic.metadata.name.metrics.collector.serviceaccount" . }}
  managementState: {{ template "sumologic.metrics.collector.otelcol.managementState" . }}
  upgradeStrategy: {{ template "sumologic.metrics.collector.otelcol.upgradeStrategy" . }}
  targetAllocator:
{{- if .Values.sumologic.metrics.collector.otelcol.allocationStrategy }}
    allocationStrategy: {{ .Values.sumologic.metrics.collector.otelcol.allocationStrategy }}
{{- end }}
    enabled: true
    filterStrategy: relabel-config
    prometheusCR:
      enabled: true
      scrapeInterval: {{ .Values.sumologic.metrics.collector.otelcol.scrapeInterval }}
{{- if not (empty (include "metrics.collector.otelcol.serviceMonitorSelector" .)) }}
      serviceMonitorSelector:
        matchLabels:
{{ include "metrics.collector.otelcol.serviceMonitorSelector" . | indent 10 }}
{{ else }}
      serviceMonitorSelector:
        matchLabels:
          release: {{ .Release.Name }}
{{- end }}
{{- if not (empty (include "metrics.collector.otelcol.podMonitorSelector" .)) }}
      podMonitorSelector:
        matchLabels:
{{ include "metrics.collector.otelcol.podMonitorSelector" . | indent 10 }}
{{ else }}
      podMonitorSelector:
        matchLabels:
          release: {{ .Release.Name }}
{{- end }}
    serviceAccount: {{ template "sumologic.metadata.name.metrics.targetallocator.serviceaccount" . }}
{{- if not (empty (include "metrics.collector.otelcol.nodeSelector" .)) }}
    nodeSelector:
{{ include "metrics.collector.otelcol.nodeSelector" . | indent 6 }}
{{- end }}
    resources:
      {{ .Values.sumologic.metrics.collector.otelcol.targetAllocator.resources | toYaml | nindent 6 }}
{{- if not (empty (include "metrics.collector.otelcol.tolerations" .)) }}
    tolerations:
{{ include "metrics.collector.otelcol.tolerations" . | indent 6 }}
{{- end }}
{{- if not (empty (include "metrics.collector.otelcol.affinity" .)) }}
    affinity:
{{ include "metrics.collector.otelcol.affinity" . | indent 6 }}
{{- end }}
{{- if not (empty (include "metrics.collector.otelcol.nodeSelector" .)) }}
  nodeSelector:
{{ include "metrics.collector.otelcol.nodeSelector" . | indent 4 }}
{{- end }}
{{- if not (empty (include "metrics.collector.otelcol.tolerations" .)) }}
  tolerations:
{{ include "metrics.collector.otelcol.tolerations" . | indent 6 }}
{{- end }}
{{- if not (empty (include "metrics.collector.otelcol.affinity" .)) }}
  affinity:
{{ include "metrics.collector.otelcol.affinity" . | indent 6 }}
{{- end }}
{{- if .Values.sumologic.metrics.collector.otelcol.priorityClassName }}
  priorityClassName: {{ .Values.sumologic.metrics.collector.otelcol.priorityClassName | quote }}
{{- end }}
{{- if eq (include "metrics.collector.autoscaling.enabled" .) "true" }}
  autoscaler:
    maxReplicas: {{ .Values.sumologic.metrics.collector.otelcol.autoscaling.maxReplicas }}
{{- if eq (include "metrics.collector.singleLayerPipeline.enabled" .) "true" }}
    minReplicas: {{ max 3 (int .Values.sumologic.metrics.collector.otelcol.autoscaling.minReplicas) }}
{{- else }}
    minReplicas: {{ .Values.sumologic.metrics.collector.otelcol.autoscaling.minReplicas }}
{{- end }}
    targetCPUUtilization: {{ .Values.sumologic.metrics.collector.otelcol.autoscaling.targetCPUUtilizationPercentage }}
{{- if .Values.sumologic.metrics.collector.otelcol.autoscaling.targetMemoryUtilizationPercentage }}
    targetMemoryUtilization: {{ .Values.sumologic.metrics.collector.otelcol.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- if .Values.sumologic.metrics.collector.otelcol.autoscaling.behavior }}
    behavior:
{{ toYaml .Values.sumologic.metrics.collector.otelcol.autoscaling.behavior | nindent 6 }}
{{- end }}
{{- end }}
  env:
{{- if not .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled }}
  - name: METADATA_METRICS_SVC
    valueFrom:
      configMapKeyRef:
        name: sumologic-configmap
        key: metadataMetrics
{{- else }}
{{- $ctx := .Values -}}
{{- if .Values.sumologic.sourcelessMode -}}
{{- include "kubernetes.extension.envs" . | nindent 2 -}}
{{- else -}}
{{- include "kubernetes.sources.envs" (dict "Context" $ctx "Type" "metrics") | nindent 2 -}}
{{- end -}}
{{- include "proxy-env-variables" . | nindent 2 -}}
{{- if .Values.sumologic.metrics.collector.otelcol.extraEnvVars }}
{{ toYaml .Values.sumologic.metrics.collector.otelcol.extraEnvVars | nindent 2 }}
{{- end }}
{{- end }}
  - name: NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: MY_POD_IP
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: status.podIP
  - name: MY_POD_NAME
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.name
  podAnnotations:
    ## The operator adds this annotation by default, but we use our own ServiceMonitor
    prometheus.io/scrape: "false"
{{- if .Values.sumologic.podAnnotations -}}
    {{ toYaml .Values.sumologic.podAnnotations | nindent 4 }}
{{- end }}
{{- if .Values.sumologic.metrics.collector.otelcol.podAnnotations -}}
    {{ toYaml .Values.sumologic.metrics.collector.otelcol.podAnnotations | nindent 4 }}
{{- end }}
{{- if .Values.sumologic.metrics.collector.otelcol.terminationGracePeriodSeconds }}
  terminationGracePeriodSeconds: {{ .Values.sumologic.metrics.collector.otelcol.terminationGracePeriodSeconds }}
{{- end }}
  podSecurityContext:
    {{ .Values.sumologic.metrics.collector.otelcol.securityContext | toYaml | nindent 4 }}
  ports:
  - name: pprof
    port: 1777
{{- if .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled }}
  - name: metrics-rw
    port: 9888
{{- end }}
  resources:
    {{ .Values.sumologic.metrics.collector.otelcol.resources | toYaml | nindent 4 }}
{{- if .Values.sumologic.metrics.collector.otelcol.livenessProbe }}
  livenessProbe:
    {{ .Values.sumologic.metrics.collector.otelcol.livenessProbe | toYaml | nindent 4 }}
{{- else if .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled }}
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
{{- end }}
{{- if .Values.sumologic.metrics.collector.otelcol.readinessProbe }}
  readinessProbe:
    {{ .Values.sumologic.metrics.collector.otelcol.readinessProbe | toYaml | nindent 4 }}
{{- else if .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled }}
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
{{- end }}
  volumes:
  - name: tmp
    emptyDir: {}
{{- if not (and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled .Values.metadata.persistence.enabled) }}
  - name: file-storage
    emptyDir: {}
{{- end }}
{{- if and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled .Values.sumologic.metrics.collector.otelcol.extraVolumes }}
{{ toYaml .Values.sumologic.metrics.collector.otelcol.extraVolumes | nindent 2 }}
{{- end }}
  volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: file-storage
    mountPath: /var/lib/storage/otc
{{- if and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled .Values.sumologic.metrics.collector.otelcol.extraVolumeMounts }}
{{ toYaml .Values.sumologic.metrics.collector.otelcol.extraVolumeMounts | nindent 2 }}
{{- end }}
{{- if and .Values.sumologic.metrics.collector.otelcol.singleLayerPipeline.enabled .Values.metadata.persistence.enabled }}
{{- if .Values.sumologic.persistentVolumeClaimRetentionPolicyEnabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: {{ .Values.sumologic.metrics.collector.otelcol.persistentVolumeClaimRetentionPolicywhenScaled }}
{{- end }}
  volumeClaimTemplates:
  - metadata:
      name: file-storage
      labels:
{{- $pvcLabels := dict "sumologic.com/component" "metrics-collector" }}
{{- if .Values.metadata.persistence.pvcLabels }}
{{- $pvcLabels = merge $pvcLabels .Values.metadata.persistence.pvcLabels }}
{{- end }}
{{ toYaml $pvcLabels | indent 8 }}
    spec:
      accessModes: [{{ .Values.metadata.persistence.accessMode }}]
{{- if .Values.metadata.persistence.storageClass }}
      storageClassName: {{ .Values.metadata.persistence.storageClass | quote }}
{{- end }}
      resources:
        requests:
          storage: {{ .Values.metadata.persistence.size }}
{{- end }}
  config:
{{- $finalConfig | toYaml | nindent 4 }}
{{- end }}
