{{/*
When sourceless mode is enabled but the setup job is disabled (e.g. GitOps/ArgoCD),
the installation token cannot be created by Terraform. Instead, it must be supplied
via sumologic.installationToken in values and this template writes it to the
sumologic-extension secret so pods can reference it via secretKeyRef.

When setupEnabled=true, this secret is managed by the setup job (Terraform) instead.
*/}}
{{- if and .Values.sumologic.sourcelessMode .Values.sumologic.installationToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sumologic.extension.secret.name" . }}
  namespace: {{ template "sumologic.namespace" . }}
  labels:
    {{- include "sumologic.labels.common" . | nindent 4 }}
type: Opaque
data:
  SUMOLOGIC_INSTALLATION_TOKEN: {{ .Values.sumologic.installationToken | b64enc }}
{{- end }}
