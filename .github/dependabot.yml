version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

    labels:
      - skip-changelog

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "gomod"
    directory: "/tests/"
    schedule:
      interval: "weekly"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

    labels:
      - skip-changelog

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"